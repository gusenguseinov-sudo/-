format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
workflows:
  primary:
    summary: Debug-сборка APK для тестирования
    steps:
    - git-clone@8: {}
    - script@1:
        title: Подготовить Gradle wrapper
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /tmp
              /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
            fi
            chmod +x gradlew
    - android-build@1:
        inputs:
        - module: app
        - variant: debug
    - deploy-to-bitrise-io@2: {}
